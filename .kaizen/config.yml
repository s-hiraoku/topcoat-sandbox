version: 1
agent:
  default: claude
  fallback: true
  model:
    claude: null
    codex: null
run:
  maxIssuesPerNight: 1
  issueTimeoutMinutes: 120
  runTimeoutMinutes: 240
  maxVerifyRetries: 2
  maxAttemptsPerIssue: 3
  maxOpenPullRequests: 1
  latestStartHour: 7
safety:
  operationMode: external
  minFreeDiskMb: 1024
  wipLimit: 2
  envAllowlist:
    - PATH
    - HOME
    - USER
    - LOGNAME
    - SHELL
    - TERM
    - LANG
    - LC_ALL
    - LC_CTYPE
    - TMPDIR
    - TMP
    - TEMP
    - KAIZEN_TMPDIR
    - KAIZEN_HOME
scheduler:
  jobs:
    maintenance:
      enabled: true
      schedule:
        type: daily
        time: 02:00
      run:
        mode: maintenance
        lateStartGuard: true
    issue-watch:
      enabled: false
      schedule:
        type: interval
        everyMinutes: 5
      run:
        mode: watch
        skipIfRunning: true
commands:
  setup: cargo fetch
  verify:
    - cargo test
    - cargo clippy
  verifyTimeoutMinutes: 15
builder:
  command: builder-agent
  resultPath: .kaizen/builder/build-result.json
verifier:
  enabled: true
  command: verifier
  resultPath: .kaizen/verifier/verify-result.json
  timeoutMinutes: 15
  expectedRepository: https://github.com/kaizen-agents-org/verifier.git
  expectedRef: refs/heads/main
  freshnessTimeoutSeconds: 30
guardian:
  enabled: true
  mode: sync
  command: codex
  timeoutMinutes: 60
  maxAttempts: 5
  reviewSettleSeconds: 30
goal:
  maxIterations: 5
  issueLabel: kaizen:goal
  evaluation:
    command: null
    timeoutMinutes: 15
  agent:
    command: codex
    args:
      - exec
      - --sandbox
      - read-only
      - "-"
    resultPath: goal-result.json
    timeoutMinutes: 20
policy:
  mode: pr-only
  directCommit:
    maxChangedLines: 0
    maxChangedFiles: 0
  protectedPaths:
    - .github/**
    - .gitlab-ci.yml
    - .circleci/**
    - azure-pipelines.yml
    - Jenkinsfile
    - "**/.env*"
    - "**/secrets/**"
    - "**/*migration*/**"
    - "**/*release*/**"
    - "**/*publish*/**"
    - .npmrc
    - .pypirc
    - Dockerfile
    - .kaizen/**
  forbiddenPaths:
    - "**/.git/**"
    - "**/.ssh/**"
    - "**/.gnupg/**"
    - "**/*credential*/**"
    - "**/*.pem"
    - "**/*.key"
git:
  defaultBranch: main
  branchPrefix: kaizen/
  commitMessageFormat: "kaizen: {summary} (#{issue})"
instant:
  unattendedMode: pr
report:
  notification: true
  issueComments: true
  starvationRuns: 2
issues:
  label: kaizen
  executionAuthorization:
    label: kaizen:authorized
    minimumPermission: triage
  selection:
    mode: auto
    includeLabel: kaizen:ready
    excludeLabels:
      - kaizen:needs-human
  priorityOrder:
    - kaizen:P0
    - kaizen:P1
    - kaizen:P2
