name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.toml requires rust-version 1.95 and edition 2024, so pin the
      # toolchain rather than relying on whatever the runner ships.
      - name: Install Rust
        run: |
          rustup toolchain install 1.95 --profile minimal --component clippy
          rustup default 1.95

      - uses: Swatinem/rust-cache@v2

      - run: cargo test

      - run: cargo clippy
