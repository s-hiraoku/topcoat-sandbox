[package]
name = "herdr-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.51", features = ["macros", "process", "rt-multi-thread"] }
topcoat = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
